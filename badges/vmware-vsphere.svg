<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20" role="img" aria-label="VMware vSphere">
  <title>VMware vSphere</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round">
    <rect width="120" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#round)">
    <rect width="120" height="20" fill="#1d428a"/>
    <rect width="120" height="20" fill="url(#shine)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.1">
    <circle cx="10" cy="10" r="5.2"/>
    <ellipse cx="10" cy="10" rx="5.2" ry="2.1"/>
    <ellipse cx="10" cy="10" rx="2.1" ry="5.2"/>
  </g>
  <g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="20" y="14" textLength="94">VMware vSphere</text>
  </g>
</svg>
